<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813"/>
      <stop offset="50%" stop-color="#0A1124"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#7000FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00F0FF" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" rx="12" fill="url(#bgGradient)"/>
  <rect width="1000" height="240" rx="12" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="998" height="238" rx="11" stroke="#0E223D" stroke-width="1.2"/>

  <!-- Top Accent Beam -->
  <line x1="80" y1="2" x2="920" y2="2" stroke="url(#cyanLine)" stroke-width="2"/>

  <!-- Geometric Tech Schematics in Corner -->
  <g opacity="0.25" stroke="#00F0FF" stroke-width="0.8">
    <circle cx="920" cy="80" r="50" stroke-dasharray="4 4"/>
    <circle cx="920" cy="80" r="30"/>
    <circle cx="920" cy="80" r="10"/>
    <line x1="870" y1="80" x2="970" y2="80"/>
    <line x1="920" y1="30" x2="920" y2="130"/>
  </g>

  <!-- Left Header Content -->
  <!-- Eyebrow Tag -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="280" height="24" rx="12" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" fill="#00F0FF" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      SYS_ONLINE // FULL STACK &amp; AI ENGINEER
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="125" fill="url(#nameGradient)" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="1">
    SAHIL NARKAR
  </text>

  <!-- Professional Subtitle -->
  <text x="62" y="160" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">
    Full Stack Developer <tspan fill="#00F0FF">&bull;</tspan> AI &amp; Machine Learning Enthusiast
  </text>

  <!-- Tagline -->
  <text x="62" y="192" fill="#64748B" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="400" font-style="italic">
    "Building intelligent systems. Engineering digital experiences. Exploring the future of AI."
  </text>

  <!-- Right Side Stat Pills -->
  <g transform="translate(680, 140)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="260" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="20" fill="#94A3B8" font-family="'Segoe UI', -apple-system, monospace" font-size="11">
      LOCATION: <tspan fill="#F8FAFC" font-weight="700">Mumbai, Maharashtra, IN</tspan>
    </text>

    <!-- Pill 2 -->
    <rect x="0" y="38" width="260" height="30" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="58" fill="#94A3B8" font-family="'Segoe UI', -apple-system, monospace" font-size="11">
      SPECIALIZATION: <tspan fill="#00F0FF" font-weight="700">AI Agents &amp; Web Apps</tspan>
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="60" y1="218" x2="940" y2="218" stroke="#1E293B" stroke-width="1"/>
</svg>
