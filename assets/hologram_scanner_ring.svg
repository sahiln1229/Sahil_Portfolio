<svg width="100%" height="32" viewBox="0 0 1000 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#7000FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Continuous Laser Pulse Bar -->
  <line x1="50" y1="16" x2="950" y2="16" stroke="url(#scanGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </line>

  <!-- Moving Target Reticle -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="100 0; 900 0; 100 0" dur="8s" repeatCount="indefinite"/>
    <polygon points="0,6 6,16 0,26 -6,16" fill="#00F0FF"/>
    <circle cx="0" cy="16" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Left / Right Fixed Reticle Brackets -->
  <line x1="80" y1="8" x2="80" y2="24" stroke="#00F0FF" stroke-width="1.5"/>
  <line x1="920" y1="8" x2="920" y2="24" stroke="#00F0FF" stroke-width="1.5"/>
  <text x="500" y="20" text-anchor="middle" fill="#00F0FF" font-family="'Segoe UI', -apple-system, monospace" font-size="10" font-weight="700" letter-spacing="3" opacity="0.8">
    &lt; HOLOGRAPHIC 3D RECONSTRUCTION // MULTI-SPECTRAL MESH &gt;
  </text>
</svg>
