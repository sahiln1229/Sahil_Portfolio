<svg width="100%" height="130" viewBox="0 0 1000 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hex telemetry decoration -->
  <g opacity="0.4" stroke="#00F0FF" stroke-width="0.8">
    <polygon points="50,20 62,27 62,41 50,48 38,41 38,27"/>
    <polygon points="950,20 962,27 962,41 950,48 938,41 938,27"/>
    <line x1="75" y1="34" x2="220" y2="34" stroke-dasharray="4 4"/>
    <line x1="780" y1="34" x2="925" y2="34" stroke-dasharray="4 4"/>
  </g>

  <!-- Eyebrow Sub-header -->
  <text x="500" y="32" text-anchor="middle" fill="#00F0FF" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" letter-spacing="6">
    // SYSTEM IDENTITY PROTOCOL // LEVEL 01 ACCESS
  </text>

  <!-- Main Hero Title -->
  <text x="500" y="82" text-anchor="middle" fill="url(#titleGrad)" font-family="'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="4" filter="url(#neonGlow)">
    SAHIL NARKAR
  </text>

  <!-- Professional Subtitle -->
  <text x="500" y="112" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3">
    FULL STACK DEVELOPER <tspan fill="#00F0FF">&bull;</tspan> AI ENGINEER IN PROGRESS <tspan fill="#00F0FF">&bull;</tspan> BACKEND ARCHITECT
  </text>

  <!-- Sci-Fi Reticle Brackets -->
  <path d="M 230 65 L 210 65 L 210 85" stroke="#00F0FF" stroke-width="1.8" fill="none"/>
  <path d="M 770 65 L 790 65 L 790 85" stroke="#00F0FF" stroke-width="1.8" fill="none"/>
</svg>
