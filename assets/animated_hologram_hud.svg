<svg width="100%" height="90" viewBox="0 0 1000 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hudBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#09152C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040914" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="neonBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect x="2" y="2" width="996" height="86" rx="10" fill="url(#hudBgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" filter="url(#neonBlur)"/>

  <!-- Animated Sweeping Laser Scanline -->
  <line x1="0" y1="2" x2="0" y2="88" stroke="url(#laserBeam)" stroke-width="2">
    <animate attributeName="x1" values="2;994;2" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="2;994;2" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Left: Animated Rotating Radar Gimbal -->
  <g transform="translate(52, 45)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="26" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 2"/>
    <!-- Rotating Sector -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="22" stroke="#00F0FF" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="14 30"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1"/>
    </g>
    <!-- Counter-rotating inner ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="14" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="8 12"/>
    </g>
    <!-- Pulsing Center Node -->
    <circle cx="0" cy="0" r="4" fill="#00F0FF">
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Telemetry Block 1: Status & Protocol -->
  <g transform="translate(100, 32)">
    <text x="0" y="0" fill="#00F0FF" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="11" font-weight="800" letter-spacing="2">
      // NEURAL IDENTITY MATRIX
    </text>
    <text x="0" y="20" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14" font-weight="700">
      SAHIL NARKAR <tspan fill="#88A0C0" font-size="12" font-weight="500">&mdash; WORKSTATION v5.0</tspan>
    </text>
    <text x="0" y="38" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="10" letter-spacing="1">
      SYS_STATUS: <tspan fill="#00F0FF" font-weight="700">ACTIVE</tspan> | CORE: <tspan fill="#A78BFA" font-weight="700">AGENTIC AI</tspan> | LATENCY: <tspan fill="#34D399" font-weight="700">18ms</tspan>
    </text>
  </g>

  <!-- Center Divider Ticks -->
  <line x1="450" y1="16" x2="450" y2="74" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="450" cy="45" r="2" fill="#00F0FF"/>

  <!-- Telemetry Block 2: Live Coordinates & Mission -->
  <g transform="translate(470, 32)">
    <text x="0" y="0" fill="#A78BFA" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1.5">
      GEOLOCATION &amp; SPECIALIZATION TELEMETRY
    </text>
    <text x="0" y="20" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">
      MUMBAI NODE <tspan fill="#00F0FF">[19.0178&deg; N, 72.8478&deg; E]</tspan>
    </text>
    <text x="0" y="38" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="10" letter-spacing="1">
      DOMAIN: <tspan fill="#E2E8F0">FULL STACK</tspan> &bull; <tspan fill="#E2E8F0">AI/ML</tspan> &bull; <tspan fill="#E2E8F0">AUTONOMOUS AGENTS</tspan>
    </text>
  </g>

  <!-- Right Divider Ticks -->
  <line x1="770" y1="16" x2="770" y2="74" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Telemetry Block 3: Uplink Status -->
  <g transform="translate(790, 32)">
    <text x="0" y="0" fill="#34D399" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1.5">
      &bull; RUNTIME INTEGRITY
    </text>
    <text x="0" y="20" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="700">
      100% OPERATIONAL
    </text>
    <text x="0" y="38" fill="#00F0FF" font-family="'Segoe UI', -apple-system, Roboto, monospace" font-size="10" letter-spacing="1">
      READY FOR UPLINK &rarr;
    </text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 6 16 L 6 6 L 16 6" stroke="#00F0FF" stroke-width="1.8" fill="none"/>
  <path d="M 994 16 L 994 6 L 984 6" stroke="#00F0FF" stroke-width="1.8" fill="none"/>
  <path d="M 6 74 L 6 84 L 16 84" stroke="#00F0FF" stroke-width="1.8" fill="none"/>
  <path d="M 994 74 L 994 84 L 984 84" stroke="#00F0FF" stroke-width="1.8" fill="none"/>
</svg>
