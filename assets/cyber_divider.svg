<svg width="100%" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="1"/>
      <stop offset="55%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background faint track -->
  <line x1="50" y1="12" x2="1150" y2="12" stroke="#00F0FF" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6 4" />
  <!-- Center Main Glowing Beam -->
  <line x1="150" y1="12" x2="1050" y2="12" stroke="url(#cyberLine)" stroke-width="2" filter="url(#glow)"/>
  <!-- Center HUD Diamond & Reticle -->
  <polygon points="600,4 608,12 600,20 592,12" fill="#00F0FF" filter="url(#glow)"/>
  <circle cx="600" cy="12" r="2" fill="#FFFFFF"/>
  <rect x="520" y="9" width="30" height="6" fill="#00F0FF" fill-opacity="0.3"/>
  <rect x="650" y="9" width="30" height="6" fill="#7000FF" fill-opacity="0.3"/>
  <!-- Side Ticks -->
  <line x1="300" y1="8" x2="300" y2="16" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="900" y1="8" x2="900" y2="16" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="350" cy="12" r="1.5" fill="#00F0FF" fill-opacity="0.6"/>
  <circle cx="850" cy="12" r="1.5" fill="#00F0FF" fill-opacity="0.6"/>
</svg>
